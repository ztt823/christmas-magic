<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Christmas Magic · 圣诞鎏金魔法</title>
<style>
:root{--gold:#e9c879;--gold2:#fff0bd;--green:#071b16;--muted:#b8b39d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04130f;color:#f7edcf;font-family:"Aptos","Microsoft YaHei",sans-serif}
body{background:radial-gradient(ellipse at 50% 42%,#12372a 0%,#071b16 48%,#020907 100%)}
#scene{position:fixed;inset:0;z-index:0}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.52) 100%)}
header{position:fixed;z-index:3;top:0;left:0;right:0;text-align:center;padding:28px 18px 12px;pointer-events:none}
.kicker{font-size:10px;letter-spacing:.48em;color:#d7bd7d;text-transform:uppercase}
h1{margin:8px 0 4px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,4vw,48px);font-weight:400;letter-spacing:.13em;color:#f7e7b8;text-shadow:0 0 24px #d6a84b55}
.subtitle{font-size:11px;letter-spacing:.2em;color:#b5b49a}
#hint{position:fixed;z-index:3;top:142px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.12em;color:#d7c99f;background:#0a211bbd;border:1px solid #b99b5845;padding:9px 17px;border-radius:30px;white-space:nowrap;backdrop-filter:blur(12px)}
#toolbar{position:fixed;z-index:5;left:24px;bottom:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,.upload-label{border:1px solid #c7a95e80;background:linear-gradient(135deg,#18382cdd,#071b16ee);color:#f3dfaa;border-radius:30px;padding:11px 17px;font-size:12px;letter-spacing:.08em;cursor:pointer;box-shadow:0 8px 28px #0005;transition:.25s}
button:hover,.upload-label:hover{background:linear-gradient(135deg,#31543e,#10291f);border-color:#e9c879;transform:translateY(-2px)}
input[type=file]{display:none}
#cameraBox{position:fixed;z-index:4;right:22px;bottom:22px;width:176px;border:1px solid #c7a95e66;border-radius:13px;overflow:hidden;background:#06120f;box-shadow:0 10px 35px #0008}
#cameraBox video{display:block;width:100%;transform:scaleX(-1);opacity:.72}
#camLabel{font-size:9px;letter-spacing:.18em;text-align:center;color:#d9c58e;padding:7px}
#photoStage{position:fixed;z-index:2;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.photo-card{display:none;position:absolute;width:min(34vw,360px);height:min(47vh,450px);padding:10px;background:linear-gradient(145deg,#f8e7b6,#9d7838 40%,#f5dfa2);border-radius:5px;box-shadow:0 25px 80px #0009,0 0 50px #e9c87922;opacity:0;transform:translateY(18px) scale(.96);transition:opacity .55s ease,transform .65s cubic-bezier(.2,.75,.2,1)}
.photo-card.active{display:block;opacity:1;transform:translateY(0) scale(1)}
.photo-card img{width:100%;height:100%;object-fit:cover;display:block}
#photoCaption{position:fixed;z-index:3;bottom:30px;left:50%;transform:translateX(-50%);font-family:Georgia,serif;letter-spacing:.24em;font-size:12px;color:#e8d39d;text-shadow:0 2px 12px #000;pointer-events:none}
#status{position:fixed;z-index:4;left:50%;bottom:26px;transform:translateX(-50%);font-size:10px;color:#b7b69c;letter-spacing:.13em;white-space:nowrap}
#startOverlay{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse,#12372bdc,#020907f5);backdrop-filter:blur(8px)}
.start-panel{width:min(92vw,480px);padding:38px 30px;text-align:center;border:1px solid #d3b66c66;border-radius:18px;background:linear-gradient(145deg,#10291feF,#06140ff5);box-shadow:0 25px 100px #0009}
.start-panel .star{font-size:34px;color:#f1d48d;text-shadow:0 0 28px #f2cf75}
.start-panel h2{font:400 27px Georgia,serif;letter-spacing:.1em;color:#f4e3b4;margin:12px 0}
.start-panel p{font-size:12px;line-height:1.9;color:#c5c1a8;margin:12px 0 23px}
#startBtn{font-size:13px;padding:13px 28px;background:linear-gradient(135deg,#b9964d,#6e5526);color:#10150e;border:0}
#startError{color:#f1b6a2;font-size:11px;min-height:18px;margin-top:12px}
@media(max-width:650px){header{padding-top:20px}#hint{top:118px;font-size:10px;max-width:90vw;white-space:normal;text-align:center}#cameraBox{width:112px;right:10px;bottom:10px}#toolbar{left:10px;bottom:10px;max-width:60%;gap:6px}button,.upload-label{padding:9px 11px;font-size:10px}#status{bottom:88px;font-size:9px}.photo-card{width:66vw;height:48vh}#photoCaption{bottom:65px}}
</style>
</head>
<body>
<div id="scene"></div><div id="vignette"></div>
<header><div class="kicker">A little Christmas wonder</div><h1>MERRY CHRISTMAS</h1><div class="subtitle">让每一颗星星，都因你而闪耀</div></header>
<div id="hint">张开手掌 · 星河随手旋转</div>
<div id="photoStage"></div>
<div id="photoCaption"></div>
<div id="toolbar">
<label class="upload-label" for="photos">✧ 上传照片（最多 5 张）</label><input id="photos" type="file" accept="image/*" multiple>
<button id="cameraBtn">开启摄像头</button>
<button id="resetBtn">回到圣诞树</button>
</div>
<div id="cameraBox"><video id="video" playsinline></video><div id="camLabel">HAND TRACKING · OFF</div></div>
<div id="status">等待开启摄像头 · 请在光线充足处使用</div>
<div id="startOverlay"><div class="start-panel"><div class="star">✦</div><h2>圣诞鎏金魔法</h2><p>将手掌置于摄像头前，<br>让星光随着你的动作起舞。<br>建议使用电脑摄像头，并允许浏览器访问。</p><button id="startBtn">开启圣诞魔法</button><div id="startError"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
(()=>{
const sceneEl=document.getElementById('scene');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);
camera.position.set(0,0,18);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x000000,0);
sceneEl.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,.75));
const glow=new THREE.PointLight(0xeac66f,2.2,45);glow.position.set(0,5,8);scene.add(glow);
const root=new THREE.Group();scene.add(root);
const COUNT=3200;
const positions=new Float32Array(COUNT*3),tree=new Float32Array(COUNT*3),scatter=new Float32Array(COUNT*3),sizes=new Float32Array(COUNT);
const colors=new Float32Array(COUNT*3);
const palette=[[.96,.78,.38],[.99,.91,.68],[.25,.58,.39],[.78,.25,.19],[.95,.84,.57]];
for(let i=0;i<COUNT;i++){
 const t=Math.random(),ang=i*2.39996,rad=(1-t)*3.6;
 tree[i*3]=Math.cos(ang)*rad;tree[i*3+1]=t*8-4.2;tree[i*3+2]=Math.sin(ang)*rad*.62;
 const u=Math.random()*2-1,a=Math.random()*Math.PI*2,r=4+Math.random()*6,s=Math.sqrt(1-u*u);
 scatter[i*3]=Math.cos(a)*s*r;scatter[i*3+1]=u*r*.78;scatter[i*3+2]=Math.sin(a)*s*r;
 positions[i*3]=tree[i*3];positions[i*3+1]=tree[i*3+1];positions[i*3+2]=tree[i*3+2];
 const c=palette[Math.floor(Math.random()*palette.length)];colors.set(c,i*3);sizes[i]=Math.random();
}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(positions,3));geo.setAttribute('color',new THREE.BufferAttribute(colors,3));geo.setAttribute('aSize',new THREE.BufferAttribute(sizes,1));
const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,vertexColors:true,uniforms:{uTime:{value:0}},vertexShader:`attribute float aSize; varying vec3 vColor; uniform float uTime; void main(){vColor=color; vec4 mv=modelViewMatrix*vec4(position,1.); float twinkle=.72+.28*sin(uTime*2.2+aSize*25.); gl_PointSize=(2.0+aSize*4.2)*twinkle*(300.0/-mv.z); gl_Position=projectionMatrix*mv;}`,fragmentShader:`varying vec3 vColor; void main(){float d=length(gl_PointCoord-.5); if(d>.5) discard; float glow=exp(-d*10.); gl_FragColor=vec4(vColor,glow*.95);}`});
const points=new THREE.Points(geo,mat);root.add(points);
const ornaments=new THREE.Group();root.add(ornaments);
for(let j=0;j<9;j++){const y=-3.2+j*.78,r=(1-(y+4.2)/8)*3.35;const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.012,6,100),new THREE.MeshBasicMaterial({color:j%2?0x8f6d32:0xd7b45f,transparent:true,opacity:.42}));ring.rotation.x=Math.PI/2;ring.position.y=y;ornaments.add(ring)}
const topper=new THREE.Mesh(new THREE.OctahedronGeometry(.42,1),new THREE.MeshBasicMaterial({color:0xffe5a0,emissive:0xc99535,emissiveIntensity:1.2}));topper.position.y=4.25;root.add(topper);
const snowCount=500,snowGeo=new THREE.BufferGeometry(),snowPos=new Float32Array(snowCount*3);for(let i=0;i<snowCount;i++){snowPos[i*3]=(Math.random()-.5)*24;snowPos[i*3+1]=(Math.random()-.5)*16;snowPos[i*3+2]=(Math.random()-.5)*12}snowGeo.setAttribute('position',new THREE.BufferAttribute(snowPos,3));const snow=new THREE.Points(snowGeo,new THREE.PointsMaterial({color:0xfff0cf,size:.045,transparent:true,opacity:.55}));scene.add(snow);
let mode='tree',targetMode='tree',handX=0,handY=0,targetX=0,targetY=0,handAngle=0,targetAngle=0,angleVelocity=0,handSeen=false;
function setMode(m){targetMode=m;if(m==='tree'){document.getElementById('hint').textContent='握拳或点赞 · 星光汇聚成圣诞树';hidePhoto()}if(m==='stars')document.getElementById('hint').textContent='张开手掌 · 移动并旋转你的手，让星河起舞';}
function hidePhoto(){document.querySelectorAll('.photo-card').forEach(x=>x.classList.remove('active'));document.getElementById('photoCaption').textContent=''}
let photos=[],photoIndex=-1;
function showPhoto(i){if(!photos.length)return;photoIndex=(i+photos.length)%photos.length;document.querySelectorAll('.photo-card').forEach((el,n)=>el.classList.toggle('active',n===photoIndex));document.getElementById('photoCaption').textContent=`CHRISTMAS MEMORIES  ·  ${String(photoIndex+1).padStart(2,'0')} / ${String(photos.length).padStart(2,'0')}`;setMode('photo')}
document.getElementById('photos').addEventListener('change',e=>{photos.forEach(p=>URL.revokeObjectURL(p.url));photos=[];document.getElementById('photoStage').innerHTML='';[...e.target.files].slice(0,5).forEach((f,i)=>{const url=URL.createObjectURL(f);photos.push({url});const card=document.createElement('div');card.className='photo-card';const img=document.createElement('img');img.src=url;card.appendChild(img);document.getElementById('photoStage').appendChild(card)});if(photos.length)showPhoto(0)});
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function fingerUp(lm,tip,pip){return lm[tip].y<lm[pip].y-.018}
function classify(lm){
 const idx=fingerUp(lm,8,6),mid=fingerUp(lm,12,10),ring=fingerUp(lm,16,14),pinky=fingerUp(lm,20,18);
 const thumb=dist(lm[4],lm[0])>dist(lm[3],lm[0])*1.12;
 const n=[idx,mid,ring,pinky].filter(Boolean).length;
 if(n===0&&!thumb)return 'fist';
 if(idx&&mid&&!ring&&!pinky)return 'v';
 if(idx&&!mid&&!ring&&!pinky&&!thumb)return 'index';
 if(thumb&&!idx&&!mid&&!ring&&!pinky&&lm[4].y<lm[3].y)return 'thumb';
 if(n>=4)return 'open';
 return 'neutral';
}
let hands,mpCamera,frameVotes=[],candidate='',candidateAt=0,lastTrigger=0,armed=true,activeGesture='neutral';
function onResults(res){
 const status=document.getElementById('status');
 if(!res.multiHandLandmarks||!res.multiHandLandmarks.length){handSeen=false;frameVotes=[];status.textContent='未检测到手掌 · 请将手放入摄像头画面';return}
 const lm=res.multiHandLandmarks[0];handSeen=true;
 const g=classify(lm);frameVotes.push(g);if(frameVotes.length>9)frameVotes.shift();
 const counts={};frameVotes.forEach(x=>counts[x]=(counts[x]||0)+1);
 const stable=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
 if(counts[stable]>=6){
  if(stable==='open'){
   activeGesture='open';armed=true;setMode('stars');
   const cx=(lm[0].x+lm[5].x+lm[17].x)/3,cy=(lm[0].y+lm[5].y+lm[17].y)/3;
   targetX=(.5-cx)*8;targetY=(.5-cy)*5;
   // Palm roll: line between index and pinky knuckles; mirror camera coordinates.
   targetAngle=Math.atan2(lm[5].y-lm[17].y,lm[17].x-lm[5].x);
   status.textContent='✧ 星河已连接 · 移动手掌并转动手腕';
  }else if(stable==='fist'||stable==='thumb'){activeGesture=stable;setMode('tree');status.textContent=stable==='fist'?'握拳 · 星光正在汇聚':'点赞 · 回到圣诞树'}
  else if((stable==='index'||stable==='v')&&armed&&Date.now()-lastTrigger>1200){activeGesture=stable;lastTrigger=Date.now();armed=false;if(photos.length){showPhoto(photoIndex+(stable==='index'?1:-1));status.textContent=stable==='index'?'食指 · 下一张照片':'V 字 · 上一张照片'}else{status.textContent='请先上传照片';}}
  else if(stable==='neutral'){armed=true;if(activeGesture!=='open'){activeGesture='neutral';}}
 }
}
async function startCamera(){
 const err=document.getElementById('startError');err.textContent='';
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('当前页面无法访问摄像头，请使用 HTTPS 地址打开。');
  if(!window.Hands||!window.Camera)throw new Error('手势识别组件加载失败，请检查网络后刷新页面。');
  hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
  hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.72,minTrackingConfidence:.7});
  hands.onResults(onResults);
  const video=document.getElementById('video');
  mpCamera=new Camera(video,{onFrame:async()=>{await hands.send({image:video})},width:640,height:480});
  await mpCamera.start();document.getElementById('camLabel').textContent='HAND TRACKING · ON';document.getElementById('cameraBtn').textContent='摄像头已开启';document.getElementById('startOverlay').style.display='none';
 }catch(e){err.textContent=e.message||'启动失败，请检查摄像头权限。';}
}
document.getElementById('startBtn').onclick=startCamera;document.getElementById('cameraBtn').onclick=startCamera;document.getElementById('resetBtn').onclick=()=>{setMode('tree');activeGesture='neutral';};
function animate(t){
 requestAnimationFrame(animate);const time=t*.001;mat.uniforms.uTime.value=time;
 const dest=targetMode==='stars'?scatter:tree;
 const arr=geo.attributes.position.array;
 for(let i=0;i<COUNT;i++){const k=i*3;arr[k]+=(dest[k]-arr[k])*.055;arr[k+1]+=(dest[k+1]-arr[k+1])*.055;arr[k+2]+=(dest[k+2]-arr[k+2])*.055;}
 geo.attributes.position.needsUpdate=true;
 handX+=(targetX-handX)*.075;handY+=(targetY-handY)*.075;
 const angleDiff=Math.atan2(Math.sin(targetAngle-handAngle),Math.cos(targetAngle-handAngle));
 angleVelocity+=(angleDiff*.08-angleVelocity*.12)*.18;handAngle+=angleVelocity;
 if(targetMode==='stars'){root.position.x+=(handX-root.position.x)*.07;root.position.y+=(handY-root.position.y)*.07;root.rotation.z+=(handAngle-root.rotation.z)*.09;root.rotation.y+=.0015;}
 else{root.position.x+=(0-root.position.x)*.035;root.position.y+=(0-root.position.y)*.035;root.rotation.z*=.94;root.rotation.y+=(0-root.rotation.y)*.025;}
 ornaments.rotation.y+=.001;topper.rotation.y+=.012;topper.rotation.x=Math.sin(time*1.2)*.12;
 const sp=snowGeo.attributes.position.array;for(let i=0;i<snowCount;i++){sp[i*3+1]-=.012+(i%snowCount)/snowCount*.01;if(sp[i*3+1]<-8)sp[i*3+1]=8;sp[i*3]+=Math.sin(time+i)*.0015;}snowGeo.attributes.position.needsUpdate=true;
 if(targetMode==='stars'&&!handSeen){targetX*=.96;targetY*=.96;targetAngle*=.96;}
 renderer.render(scene,camera);
}
animate(0);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script>
</body>
</html>
